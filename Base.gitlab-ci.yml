# Terraform/Base
#
# The purpose of this template is to provide flexibility to the user so
# they are able to only include the jobs that they find interesting.
#
# Therefore, this template is not supposed to run any jobs. The idea is to only
# create hidden jobs. See: https://docs.gitlab.com/ee/ci/jobs/#hide-jobs
#
# There is a more opinionated template which we suggest the users to abide,
# which is the lib/gitlab/ci/templates/Terraform.gitlab-ci.yml
#image:
  #name: "$DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4" #"$CI_TEMPLATE_REGISTRY_HOST/gitlab-org/terraform-images/releases/1.4:v1.0.0"
image:
  name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5
  entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"


variables:
  TF_ROOT: ${CI_PROJECT_DIR}  # The relative path to the root directory of the Terraform project
  TF_STATE_NAME: default      # The name of the state file used by the GitLab Managed Terraform state backend
  TF_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${CI_PROJECT_NAME}
  TF_VAR_gitlab_token: ${CI_PASS}
  TF_VAR_environment: ${ENV}
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc

before_script:
  - echo -e "credentials \"$CI_USER\" {\n  token = \"$CI_PASS\"\n}" > $TF_CLI_CONFIG_FILE
  - cat  $TF_CLI_CONFIG_FILE
  - cd ${TF_ROOT}
  - terraform -v
  - terraform init
    -backend-config="address=${TF_ADDRESS}" 
    -backend-config="lock_address=${TF_ADDRESS}/lock" -backend-config="unlock_address=${TF_ADDRESS}/lock" -backend-config="username=$CI_USER" -backend-config="password=$CI_PASS" 
    -backend-config="lock_method=POST" 
    -backend-config="unlock_method=DELETE" 
    -backend-config="retry_wait_min=5"  

cache:
  key: "${TF_ROOT}"
  paths:
    - ${TF_ROOT}/.terraform/

.terraform:fmt:
  stage: validate
  script:
    - terraform fmt
  allow_failure: true

.terraform:validate:
  stage: validate
  script:
    - terraform validate

.terraform:build:
  stage: build
  script:
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -out=${PLAN} # -lock=false
    - "terraform show -json $PLAN | convert_report > $JSON_PLAN_FILE"
  artifacts:
    name: $CI_COMMIT_REF_NAME
    reports:
      terraform: ${TF_ROOT}/$DIR_PATH/${JSON_PLAN_FILE}
    paths:
      - ${TF_ROOT}/$PLAN
      - ${TF_ROOT}/${JSON_PLAN_FILE}
    expire_in: 7 days
  resource_group: ${TF_STATE_NAME}
      

.terraform:deploy:
  stage: deploy
  script:
    - terraform apply -input=false -auto-approve $PLAN
  resource_group: ${TF_STATE_NAME}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TF_AUTO_DEPLOY == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

.terraform:destroy:
  stage: cleanup
  script:
    - terraform destroy -auto-approve
  resource_group: ${TF_STATE_NAME}
  when: manual
